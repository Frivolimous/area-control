<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Area Control</title>
</head>
<body>
  <div id="app">
    <!-- Pixi canvas gets mounted here -->
    <div id="canvas-container"></div>

    <!-- DOM UI overlays on top of the canvas -->
    <div id="ui-root">
      <div id="entry-screen" class="screen"></div>
      <div id="lobby-screen" class="screen hidden"></div>
      <div id="config-modal" class="hidden"></div>
      <div id="hud" class="hidden">
        <div id="turn-counter"></div>
        <div id="leaderboard"></div>
        <div id="focus-controls"></div>
      </div>
    </div>
  </div>
</body>
</html>
